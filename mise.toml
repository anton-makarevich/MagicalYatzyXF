[tools]
"uv" = "0.12.0"

[tasks.install-skills]
description = "Installs all skills (local + shared) to .agents/skills and .claude/skills via the skills.sh CLI"
run = [
  "npx -y skills add ./skills --agent claude-code opencode -y",
  "npx -y skills add https://github.com/anton-makarevich/MakaMek/tree/main/skills --skill sanet-mvvm --skill generate-unit-tests --skill navigate-docs --agent claude-code opencode -y",
  "npx -y skills add https://github.com/vercel-labs/skills --skill find-skills --agent claude-code opencode -y",
  "npx -y skills add https://github.com/mattpocock/skills --skill tdd --skill triage --skill to-tickets --agent claude-code opencode -y",
  "npx -y skills add https://github.com/anthropics/skills --skill skill-creator --agent claude-code opencode -y"
]

[tasks.install-serena]
description = "Installs the Serena MCP server via uv tool install"
run = """
uv tool install -p 3.13 serena-agent
serena --version
"""

[tasks.install-devtools]
description = "Installs or updates the AvaloniaUI Developer Tools global dotnet tool (avdt), required for F12 DevTools in the Desktop app"
run = "dotnet msbuild -t:InstallAvaloniaDevTools Directory.Build.props"

[tasks.update-serena]
description = "Updates the Serena MCP server to the latest version"
run = "uv tool upgrade -p 3.13 serena-agent"
