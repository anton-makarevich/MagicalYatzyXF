name: Build iOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract and validate version from Directory.Build.props
        id: extract_version
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::Git tag ${{ github.ref_name }} does not match VersionPrefix v$VERSION"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Setup Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          MY_PP_ADHOC: ${{ secrets.MY_PP_ADHOC }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "$APPLE_DISTRIBUTION_CERT" | base64 --decode > certificate.p12
          echo "$MY_PP_ADHOC" | base64 --decode > MagicalYatzy_AdHoc.mobileprovision

          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign:,pkgbuild:,productsign:, -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp MagicalYatzy_AdHoc.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build and publish
        run: |
          cd src/Avalonia/MagicalYatzy.Avalonia.iOS
          dotnet workload restore
          dotnet publish -c Release -r ios-arm64 --self-contained -o bin/Release/iOS/publish

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src/Avalonia/MagicalYatzy.Avalonia.iOS/bin/Release/iOS/publish/MagicalYatzy.Avalonia.iOS.ipa
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MagicalYatzy-iOS-${{ env.APP_VERSION }}
          path: src/Avalonia/MagicalYatzy.Avalonia.iOS/bin/Release/iOS/publish/MagicalYatzy.Avalonia.iOS.ipa
          retention-days: 90

      - name: Clean up keychain
        if: ${{ always() }}
        run: security delete-keychain build.keychain
