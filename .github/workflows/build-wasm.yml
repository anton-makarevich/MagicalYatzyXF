name: Build WASM App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        default: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract version from Directory.Build.props
        id: extract_version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>).*(?=</VersionPrefix>)' Directory.Build.props)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Build
        run: |
          cd src/Avalonia/MagicalYatzy.Avalonia.Browser
          dotnet workload restore
          dotnet workload repair
          dotnet publish -c ${{ github.event.inputs.configuration || 'Release' }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src/Avalonia/MagicalYatzy.Avalonia.Browser/bin/${{ github.event.inputs.configuration || 'Release' }}/net10.0-browser/publish/wwwroot/*
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload WASM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicalYatzy-WASM-${{ env.APP_VERSION }}
          path: src/Avalonia/MagicalYatzy.Avalonia.Browser/bin/${{ github.event.inputs.configuration || 'Release' }}/net10.0-browser/publish/wwwroot
          retention-days: 90
