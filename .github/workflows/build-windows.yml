name: Build Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract and validate version from Directory.Build.props
        id: extract_version
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::Git tag ${{ github.ref_name }} does not match VersionPrefix v$VERSION"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Build and publish
        run: |
          dotnet publish src/Avalonia/MagicalYatzy.Avalonia.Desktop/MagicalYatzy.Avalonia.Desktop.csproj -c Release -r win-x64 -o src/Avalonia/MagicalYatzy.Avalonia.Desktop/bin/Release/publish

      - name: Create installer
        run: |
          dotnet tool install wix --global
          dotnet tool install Sanet.Tools.Wix.ComponentsUpdater --global
          cd src/Avalonia/MagicalYatzy.Avalonia.Desktop/.windows/wix
          sanet-wix-tools MagicalYatzyComponents ..\..\bin\Release\publish
          wix build .\Package.wxs .\MagicalYatzyComponents.wxs .\Folders.wxs .\Package.en-us.wxl -o bin/MagicalYatzySetup

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src/Avalonia/MagicalYatzy.Avalonia.Desktop/.windows/wix/bin/MagicalYatzySetup.msi
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicalYatzy-Windows-${{ env.APP_VERSION }}
          path: src/Avalonia/MagicalYatzy.Avalonia.Desktop/.windows/wix/bin/MagicalYatzySetup.msi
          retention-days: 90
