name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run Core tests
        run: dotnet test tests/MagicalYatzy.Core.Tests/MagicalYatzy.Core.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute /p:Include=[MagicalYatzy]*

      - name: Upload Core tests results
        run: bash <(curl -s https://codecov.io/bash) -f "tests/MagicalYatzy.Core.Tests/coverage.opencover.xml" -t ${{ secrets.CODECOV_TOKEN }}

