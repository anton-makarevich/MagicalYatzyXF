name: Build Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract and validate version from Directory.Build.props
        id: extract_version
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::Git tag ${{ github.ref_name }} does not match VersionPrefix v$VERSION"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build and publish
        run: |
          cd src/Avalonia/MagicalYatzy.Avalonia.Android
          dotnet workload restore
          dotnet build -t:InstallAndroidDependencies -f:net10.0-android -p:AcceptAndroidSDKLicenses=True -p:AndroidSdkPath="/usr/local/lib/android/sdk/"
          dotnet publish -c Release -o bin/Release/android/publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src/Avalonia/MagicalYatzy.Avalonia.Android/bin/Release/android/publish/*-Signed.apk
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicalYatzy-Android-${{ env.APP_VERSION }}
          path: src/Avalonia/MagicalYatzy.Avalonia.Android/bin/Release/android/publish/*-Signed.apk
          retention-days: 90
