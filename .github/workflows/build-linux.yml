name: Build Linux App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract and validate version from Directory.Build.props
        id: extract_version
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::Git tag ${{ github.ref_name }} does not match VersionPrefix v$VERSION"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Build and publish
        run: |
          dotnet publish src/Avalonia/MagicalYatzy.Avalonia.Desktop/MagicalYatzy.Avalonia.Desktop.csproj -c Release -r linux-x64 -o src/Avalonia/MagicalYatzy.Avalonia.Desktop/bin/Release/ubuntu/publish --self-contained

      - name: Archive
        run: |
          cd src/Avalonia/MagicalYatzy.Avalonia.Desktop/bin/Release/ubuntu/publish
          rm -f *.pdb
          chmod 777 MagicalYatzy.Avalonia.Desktop
          zip -r MagicalYatzy.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src/Avalonia/MagicalYatzy.Avalonia.Desktop/bin/Release/ubuntu/publish/MagicalYatzy.zip
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload Archive as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MagicalYatzy-Linux-${{ env.APP_VERSION }}
          path: src/Avalonia/MagicalYatzy.Avalonia.Desktop/bin/Release/ubuntu/publish/MagicalYatzy.zip
          retention-days: 90
