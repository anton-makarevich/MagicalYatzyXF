name: Publish Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Inject extra env vars
        uses: FranzDiebold/github-env-vars-action@v2.4.0
        
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build and publish
        run: |
          cd src/Avalonia/MagicalYatzy.Avalonia.Android
          dotnet workload restore
          dotnet build -t:InstallAndroidDependencies -f:net9.0-android -p:AcceptAndroidSDKLicenses=True -p:AndroidSdkPath="/usr/local/lib/android/sdk/"
          dotnet publish -c Release -o bin/Release/android/publish

      - name: Upload to App Center
        env:
          APPCENTER_ACCESS_TOKEN: ${{ secrets.APP_CENTER_TOKEN }}
        run: |
          npm install -g appcenter-cli
          appcenter distribute groups publish -f src/Avalonia/MagicalYatzy.Avalonia.Android/bin/Release/android/publish/nl.sanetby.magicalyatzy-Signed.apk -g Alpha --app anton.makarevich/Magical-Yatzy-Android --build-version 0.1 --build-number 1